[package]
name = "savefromspace"
version = "0.1.0"
description = "SaveFromSpace desktop downloader"
authors = ["SaveFromSpace"]
edition = "2021"

[lib]
name = "savefromspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
